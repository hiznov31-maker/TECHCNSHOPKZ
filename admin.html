<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Админка наличия</title>
<style>
:root{--bg:#120c0b;--surface:#1b1312;--ink:#f4ede6;--muted:#a79a92;--line:#3a2b29;--accent:#ffcf3d;--ok:#7bd49a;--bad:#ff8a80;color-scheme:dark}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:14px}h1{font-size:22px;margin:0}p{margin:0;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 12px}
button.primary{background:var(--accent);color:#1a1204;border-color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.row{display:grid;gap:8px}.name{font-weight:600}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button[aria-pressed=true].in{background:var(--ok);color:#08210f;border-color:var(--ok);font-weight:700}
.seg button[aria-pressed=true].order{background:var(--accent);color:#1a1204;border-color:var(--accent);font-weight:700}
.seg button[aria-pressed=true].out{background:var(--bad);color:#2a0a07;border-color:var(--bad);font-weight:700}
.msg{min-height:1.3em;font-size:13px}.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.saved{font-size:12px;color:var(--ok);min-height:1em}
</style></head><body><div class="wrap">
<div class="top"><h1>Наличие моделей</h1><button id="out" type="button" hidden>Выйти</button></div>
<form id="login" class="card"><p>Введите пароль администратора.</p><input type="password" id="pw" autocomplete="current-password" placeholder="Пароль"><button class="primary" type="submit">Войти</button><div class="msg" id="lmsg" role="status"></div></form>
<div id="app" hidden class="wrap"><div class="msg" id="warn"></div><p>Нажмите нужный статус. Комментарий (цвета, память) сохраняется кнопкой «Сохранить» или Enter. Сайт обновится за несколько секунд.</p><div id="list" class="wrap"></div></div>
</div><script>
var MODELS=[["x7ultra", "Oppo Find X7 Ultra"], ["x14u", "Xiaomi 14 Ultra"], ["x14", "Xiaomi 14"], ["x13u", "Xiaomi 13 Ultra"], ["x13pro", "Xiaomi 13 Pro"], ["x13", "Xiaomi 13"], ["x12su", "Xiaomi 12S Ultra"], ["x11u", "Xiaomi 11 Ultra"], ["x10u", "Xiaomi 10 Ultra"], ["civi4pro", "Xiaomi Civi 4 Pro"], ["magic7", "Honor Magic 7 Pro"], ["pura70u", "Huawei Pura 70 Ultra"], ["mate50", "Huawei Mate 50"], ["p40pro", "Huawei P40 Pro"], ["x7", "Oppo Find X7"], ["x6pro", "Oppo Find X6 Pro"], ["x6", "Oppo Find X6"], ["x80pro", "Vivo X80 Pro"]];var pw="",stock={};
function $(i){return document.getElementById(i)}
function api(body){body.password=pw;return fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){j._status=r.status;return j;});});}
function render(){
  var h="";MODELS.forEach(function(m){var x=stock[m[0]]||{s:"order",note:""};
    h+='<div class="card" data-id="'+m[0]+'"><div class="name">'+m[1]+'</div><div class="seg">'+
    [["in","В наличии"],["order","Под заказ"],["out","Нет"]].map(function(o){return '<button type="button" class="'+o[0]+'" data-s="'+o[0]+'" aria-pressed="'+(x.s===o[0])+'">'+o[1]+'</button>';}).join("")+
    '</div><div class="row"><input type="text" maxlength="140" placeholder="Комментарий, например: чёрный 12/256, серый 16/512" value="'+String(x.note||"").replace(/"/g,"&quot;")+'"><button type="button" data-save="1">Сохранить комментарий</button></div><div class="saved"></div></div>';});
  $("list").innerHTML=h;
}
function save(id,s,note,card){
  var sv=card.querySelector(".saved");sv.textContent="Сохраняю...";sv.style.color="";
  api({action:"set",id:id,s:s,note:note}).then(function(j){
    if(j.stock){stock=j.stock;sv.style.color="";sv.textContent="Сохранено";card.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.s===s);});}
    else{sv.style.color="var(--bad)";sv.textContent=j.error==="storage_not_connected"?"Не сохранено: хранилище не подключено в Vercel (Storage → Upstash Redis), затем Redeploy":"Не удалось сохранить ("+(j.error||j._status)+")";}
  }).catch(function(){sv.style.color="var(--bad)";sv.textContent="Нет связи, попробуйте ещё раз";});
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var card=b.closest(".card[data-id]");if(!card)return;
  var id=card.dataset.id,note=card.querySelector("input").value;
  if(b.dataset.s){save(id,b.dataset.s,note,card);}
  else if(b.dataset.save){var cur=(stock[id]||{s:"order"}).s;save(id,cur,note,card);}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.matches(".card[data-id] input")){var card=e.target.closest(".card");var id=card.dataset.id;save(id,(stock[id]||{s:"order"}).s,e.target.value,card);}});
function enter(j){
  if(j.error==="bad_password"){$("lmsg").className="msg err";$("lmsg").textContent="Неверный пароль.";try{sessionStorage.removeItem("ap");}catch(x){}return;}
  if(j.error==="no_password_configured"){$("lmsg").className="msg err";$("lmsg").textContent="Пароль не задан в Vercel (ADMIN_PASSWORD, минимум 8 символов).";return;}
  if(!j.stock){$("lmsg").className="msg err";$("lmsg").textContent="Ошибка сервера: "+(j.error||j._status);return;}
  stock=j.stock;$("login").hidden=true;$("app").hidden=false;$("out").hidden=false;
  try{sessionStorage.setItem("ap",pw);}catch(x){}
  if(j.kv===false){$("warn").className="msg err";$("warn").textContent="Хранилище не подключено в Vercel (Storage → Upstash Redis). Пока сохранять нельзя.";}
  render();
}
$("login").addEventListener("submit",function(e){e.preventDefault();pw=$("pw").value;$("lmsg").className="msg";$("lmsg").textContent="Проверяю...";api({action:"get"}).then(enter).catch(function(){$("lmsg").className="msg err";$("lmsg").textContent="Нет связи с сервером.";});});
$("out").addEventListener("click",function(){try{sessionStorage.removeItem("ap");}catch(x){}location.reload();});
try{var sp=sessionStorage.getItem("ap");if(sp){pw=sp;api({action:"get"}).then(enter);}}catch(x){}
</script></body></html>
